name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the use case or current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your idea. Alternatives are welcome.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Would you like to work on this?
      description: Let us know if you would like to contribute an implementation.
    validations:
      required: false
